name: Bug report
description: Something in The Hot Take does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form. Use the private report link on the issue chooser page instead.
        Please do not paste private review content or real client information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page
        2. Press Start
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Device and operating system
      placeholder: MacBook, macOS 15
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you use it
      options:
        - Live site
        - My own copy
        - Local server
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots without private content are helpful. Browser console messages help too.
